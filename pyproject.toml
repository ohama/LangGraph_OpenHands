[project]
name = "orchestrator"
version = "0.1.0"
description = "LangGraph + OpenHands autonomous orchestrator"
requires-python = ">=3.12"
dependencies = [
    "langgraph==1.2.6",
    "langgraph-checkpoint-sqlite==3.1.0",
    "fastapi==0.137.2",
    "uvicorn[standard]==0.49.0",
    "aiosqlite>=0.19",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "langchain-openai==1.3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
